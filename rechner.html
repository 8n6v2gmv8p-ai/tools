<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rechner</title>
<style>
  :root {
    --bg: #eceae6;
    --display: #ffffff;
    --text: #1d1d1f;
    --key: #fbfaf8;
    --key-op: #d8e2ec;
    --key-eq: #2f5d8a;
    --key-eq-text: #ffffff;
    --shadow: #c9c6c0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --display: #202225;
      --text: #f2f2f3;
      --key: #2a2c30;
      --key-op: #34414f;
      --key-eq: #5b92c9;
      --key-eq-text: #0c1a28;
      --shadow: #0c0d0e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    padding: env(safe-area-inset-top, 0px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  .display {
    flex: 1 1 0;
    min-height: 120px;
    background: var(--display);
    border-radius: 22px;
    margin-top: 14px;
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    overflow: hidden;
  }
  .history { font-size: 1.1rem; opacity: .55; min-height: 1.4em; }
  .value {
    font-size: 3.6rem;
    font-weight: 300;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    font: inherit;
    font-size: 1.6rem;
    color: var(--text);
    background: var(--key);
    border: 0;
    border-radius: 18px;
    height: 68px;
    box-shadow: 0 3px 0 var(--shadow);
    touch-action: manipulation;
    transition: transform .06s, box-shadow .06s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--shadow); }
  button:focus-visible { outline: 3px solid var(--key-eq); outline-offset: 2px; }
  .op { background: var(--key-op); }
  .eq { background: var(--key-eq); color: var(--key-eq-text); }
  .wide { grid-column: span 2; }
</style>
</head>
<body>
  <div class="display" aria-live="polite">
    <div class="history" id="history"></div>
    <div class="value" id="value">0</div>
  </div>

  <div class="keys">
    <button class="op" data-a="clear">C</button>
    <button class="op" data-a="sign">±</button>
    <button class="op" data-a="percent">%</button>
    <button class="op" data-a="op" data-v="÷">÷</button>

    <button data-a="num" data-v="7">7</button>
    <button data-a="num" data-v="8">8</button>
    <button data-a="num" data-v="9">9</button>
    <button class="op" data-a="op" data-v="×">×</button>

    <button data-a="num" data-v="4">4</button>
    <button data-a="num" data-v="5">5</button>
    <button data-a="num" data-v="6">6</button>
    <button class="op" data-a="op" data-v="−">−</button>

    <button data-a="num" data-v="1">1</button>
    <button data-a="num" data-v="2">2</button>
    <button data-a="num" data-v="3">3</button>
    <button class="op" data-a="op" data-v="+">+</button>

    <button data-a="num" data-v="0" class="wide">0</button>
    <button data-a="dot">,</button>
    <button class="eq" data-a="eq">=</button>
  </div>

<script>
  var cur = "0", prev = null, op = null, fresh = false;
  var elV = document.getElementById("value");
  var elH = document.getElementById("history");

  function fmt(s) {
    var neg = s.charAt(0) === "-";
    if (neg) s = s.slice(1);
    var p = s.split(".");
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "-" : "") + p.join(",");
  }
  function show() {
    elV.textContent = fmt(cur);
    var len = elV.textContent.length;
    elV.style.fontSize = len > 12 ? "1.9rem" : len > 9 ? "2.6rem" : "3.6rem";
    elH.textContent = (prev !== null && op) ? fmt(String(prev)) + " " + op : "";
  }
  function calc(a, b, o) {
    a = parseFloat(a); b = parseFloat(b);
    var r = o === "+" ? a + b : o === "−" ? a - b : o === "×" ? a * b : (b === 0 ? NaN : a / b);
    if (!isFinite(r)) return "Fehler";
    return String(parseFloat(r.toPrecision(12)));
  }
  function press(a, v) {
    if (cur === "Fehler" && a !== "clear") return;
    if (a === "num") {
      if (fresh) { cur = "0"; fresh = false; }
      if (cur.replace(/[-.]/g, "").length >= 12) return;
      cur = cur === "0" ? v : cur + v;
    } else if (a === "dot") {
      if (fresh) { cur = "0"; fresh = false; }
      if (cur.indexOf(".") < 0) cur += ".";
    } else if (a === "clear") {
      cur = "0"; prev = null; op = null; fresh = false;
    } else if (a === "sign") {
      if (cur !== "0") cur = cur.charAt(0) === "-" ? cur.slice(1) : "-" + cur;
    } else if (a === "percent") {
      cur = String(parseFloat((parseFloat(cur) / 100).toPrecision(12)));
    } else if (a === "op") {
      if (op && prev !== null && !fresh) { cur = calc(prev, cur, op); }
      prev = cur; op = v; fresh = true;
    } else if (a === "eq") {
      if (op && prev !== null) {
        cur = calc(prev, cur, op);
        prev = null; op = null; fresh = true;
      }
    }
    show();
  }
  document.querySelector(".keys").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) press(b.dataset.a, b.dataset.v);
  });
  show();
</script>
</body>
</html>
